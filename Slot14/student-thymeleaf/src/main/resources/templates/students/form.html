<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <!-- TODO 15.1: Tiêu đề động theo trạng thái thêm mới / cập nhật -->
    <title th:text="${student.id == null} ? 'Thêm sinh viên' : 'Cập nhật sinh viên'">Form sinh viên</title>
</head>
<body>
<section layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <!-- TODO 15.2: Tiêu đề card động -->
                    <h4 class="mb-0 text-primary"
                        th:text="${student.id == null} ? 'Thêm sinh viên mới'
                                 : 'Cập nhật sinh viên: ' + ${student.studentCode}">
                        Thêm sinh viên mới
                    </h4>
                </div>
                <div class="card-body p-4">

                    <!-- TODO 15.3: th:action, th:object, method="post", novalidate để kiểm tra validate phía server -->
                    <form th:action="@{/students/save}" th:object="${student}" method="post" novalidate>

                        <!-- TODO 15.4: Hidden ID (để phân biệt thêm mới hay cập nhật) -->
                        <input type="hidden" th:field="*{id}">

                        <!-- TODO 16.1: Khối tổng hợp tất cả các lỗi -->
                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger" role="alert">
                            <h6 class="alert-heading fw-bold">Vui lòng sửa các lỗi sau:</h6>
                            <ul class="mb-0 ps-3">
                                <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Lỗi</li>
                            </ul>
                        </div>

                        <div class="row g-3">
                            <!-- TODO 15.5 + 16.2: Ô nhập Mã sinh viên -->
                            <div class="col-md-6">
                                <label for="studentCode" class="form-label">Mã sinh viên <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" placeholder="VD: SE180001"
                                       th:field="*{studentCode}" id="studentCode" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('studentCode')}"
                                     th:errors="*{studentCode}"></div>
                            </div>

                            <!-- Họ tên -->
                            <div class="col-md-6">
                                <label for="fullName" class="form-label">Họ tên <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" placeholder="Nhập họ và tên đầy đủ"
                                       th:field="*{fullName}" id="fullName" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}"
                                     th:errors="*{fullName}"></div>
                            </div>

                            <!-- Email -->
                            <div class="col-md-6">
                                <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" placeholder="VD: annv@fpt.edu.vn"
                                       th:field="*{email}" id="email" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                     th:errors="*{email}"></div>
                            </div>

                            <!-- Ngày sinh -->
                            <div class="col-md-6">
                                <label for="dateOfBirth" class="form-label">Ngày sinh <span class="text-danger">*</span></label>
                                <input type="date" class="form-control"
                                       th:field="*{dateOfBirth}" id="dateOfBirth" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('dateOfBirth')}"
                                     th:errors="*{dateOfBirth}"></div>
                            </div>

                            <!-- GPA (dùng type="text" để có thể test lỗi type mismatch khi nhập chữ) -->
                            <div class="col-md-6">
                                <label for="gpa" class="form-label">GPA (0 - 10) <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" placeholder="VD: 8.5"
                                       th:field="*{gpa}" id="gpa" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('gpa')}"
                                     th:errors="*{gpa}"></div>
                            </div>

                            <!-- TODO 15.6: Chọn ngành lặp từ Map ${majors} -->
                            <div class="col-md-6">
                                <label for="major" class="form-label">Ngành học <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{major}" id="major" th:errorclass="is-invalid">
                                    <option value="">-- Chọn ngành học --</option>
                                    <option th:each="m : ${majors}"
                                            th:value="${m.key}"
                                            th:text="|${m.key} - ${m.value}|">SE - Kỹ thuật phần mềm</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('major')}"
                                     th:errors="*{major}"></div>
                            </div>

                            <!-- TODO 15.7: Switch Trạng thái hoạt động -->
                            <div class="col-12 mt-3">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" th:field="*{active}">
                                    <label class="form-check-label" th:for="${#ids.prev('active')}">Đang học</label>
                                </div>
                            </div>
                        </div>

                        <!-- TODO 15.8: Nút Submit và Hủy -->
                        <div class="mt-4 pt-3 border-top d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4"
                                    th:text="*{id == null} ? 'Thêm mới' : 'Lưu thay đổi'">Lưu</button>
                            <a th:href="@{/students}" class="btn btn-secondary px-4">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
