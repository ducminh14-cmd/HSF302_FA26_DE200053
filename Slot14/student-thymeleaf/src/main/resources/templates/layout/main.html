<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- TODO 8.1: layout:title-pattern ghép tiêu đề trang con với tiêu đề layout -->
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">Student Manager</title>

    <!-- TODO 8.2: Link CSS Bootstrap offline và style.css bằng th:href="@{...}" -->
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Thanh điều hướng Header (Navbar) -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/students}">Student Manager</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
                <!-- TODO 8.3: th:href tới /students và /students/new
                               Tô sáng menu (class 'active') dựa vào biến ${activeMenu} từ Controller -->
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/students}"
                       th:classappend="${activeMenu == 'list'} ? 'active'">Danh sách</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/students/new}"
                       th:classappend="${activeMenu == 'new'} ? 'active'">Thêm mới</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Khối nội dung chính (Main Body) -->
<main class="container my-4 flex-grow-1">
    <!-- TODO 8.4: Hiển thị Flash Message Thành công (${successMessage}) -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}">Thao tác thành công!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- TODO 8.4: Hiển thị Flash Message Lỗi / Thất bại (${errorMessage}) -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}">Đã xảy ra lỗi!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- TODO 8.5: Vùng thay thế layout:fragment="content" để các trang con (list, detail, form) bọc vào -->
    <section layout:fragment="content">
        <p>Nội dung trang con sẽ hiển thị ở đây.</p>
    </section>
</main>

<!-- Chân trang (Footer) -->
<footer class="bg-dark text-white-50 text-center py-3">
    <!-- TODO 8.6: Hiển thị năm hiện tại tự động bằng #temporals -->
    &copy; <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> HSF302 – Student Manager
</footer>

<!-- TODO 8.7: Script Bootstrap Bundle offline (đã gồm Popper.js) -->
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
